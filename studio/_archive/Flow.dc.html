<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    /* 4개 화면을 한 아트보드에 겹쳐 올리고 단계바가 전환한다.
       display 로 숨기므로 화면을 오가도 입력값·선택이 그대로 남는다. */
    .flowroot { position: relative; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; }
    .pane { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { color: #0066cc; }
  </style>
</helmet>

<div class="flowroot">
  <div class="pane" style="display: {{d1}}">
    <dc-import name="Start" on-goto="{{ goto }}" hint-size="1440px,900px"></dc-import>
  </div>
  <div class="pane" style="display: {{d2}}">
    <dc-import name="Blocks" on-goto="{{ goto }}" hint-size="1440px,900px"></dc-import>
  </div>
  <div class="pane" style="display: {{d3}}">
    <dc-import name="Main" on-goto="{{ goto }}" hint-size="1440px,900px"></dc-import>
  </div>
  <div class="pane" style="display: {{d4}}">
    <dc-import name="Export" on-goto="{{ goto }}" hint-size="1440px,900px"></dc-import>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1 };
  }
  renderVals() {
    const step = this.state.step;
    const show = (n) => (n === step ? 'block' : 'none');
    return {
      d1: show(1),
      d2: show(2),
      d3: show(3),
      d4: show(4),
      goto: (n) => {
        const next = Math.min(4, Math.max(1, n));
        this.setState({ step: next });
      }
    };
  }
}
</script>
</body>
</html>
